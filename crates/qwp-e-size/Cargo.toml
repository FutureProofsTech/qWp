[workspace]

[package]
name = "qwp-e-size"
description = "QHS-E static-library size probe."
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-only"
authors = ["qWp"]
publish = false

[lib]
crate-type = ["staticlib"]
test = false
doctest = false

[dependencies]
qwp-e = { path = "../qwp-e" }

[build-dependencies]
# none

[profile.release]
panic = "abort"
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
