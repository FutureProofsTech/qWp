[package]
name = "qwp-attacks"
description = "qWp attacker-side harnesses and exploit tests."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
name = "qwp_attacks"
path = "src/lib.rs"

[[bin]]
name = "attack-suite"
path = "src/bin/attack_suite.rs"

[[bin]]
name = "byte-sweep"
path = "src/bin/byte_sweep.rs"

[[bin]]
name = "audit"
path = "src/bin/audit.rs"

[dependencies]
qwp-core = { path = "../qwp-core" }
qwp-crypto = { path = "../qwp-crypto" }
qwp-classical = { path = "../qwp-classical" }
qwp-e = { path = "../qwp-e" }
qwp-hash = { path = "../qwp-hash" }
qwp-platform = { path = "../qwp-platform" }

[dev-dependencies]
# none

[build-dependencies]
# none
