[workspace]
members = [
    "crates/qwp-core",
    "crates/qwp-crypto",
    "crates/qwp-hash",
    "crates/qwp-e",
    "crates/qwp-classical",
    "crates/qwp-platform",
    "crates/qwp-cli",
    "crates/qwp-attacks",
    "crates/qwp-bench",
    "crates/qwp-tests",
    "crates/qwp-verify",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-only"
authors = ["qWp"]
publish = false

[workspace.dependencies]
# Intentionally empty. qWp has zero external dependencies.

[profile.dev]
opt-level = 0
overflow-checks = true
debug-assertions = true

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
overflow-checks = true
debug-assertions = false
incremental = false
